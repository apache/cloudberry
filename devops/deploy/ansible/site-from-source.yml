# Apache Cloudberry - Bare Metal Deployment Playbook (Source Build)
#
# Usage:
#   ansible-playbook site-from-source.yml -i inventory/hosts

---
- name: Configure all hosts
  hosts: cloudberry
  become: yes
  roles:
    - common

- name: Build and install Apache Cloudberry from source
  hosts: cloudberry
  become: yes
  roles:
    - install_from_source

- name: Configure SSH and create data directories
  hosts: coordinator
  become: yes
  become_user: gpadmin
  roles:
    - ssh

- name: Initialize Apache Cloudberry cluster
  hosts: coordinator
  become: yes
  become_user: gpadmin
  vars:
    cloudberry_admin_user: "gpadmin"
  roles:
    - initialize
