syntax = "proto3";

package yagpcc;

/*
 * Instrumentation counters for a single plan node execution.
 *
 * Field semantics mirror the PostgreSQL Instrumentation struct:
 *   ntuples     -- total tuples produced (completed loops)
 *   nloops      -- number of completed execution loops
 *   tuplecount  -- tuples emitted so far in the current (in-progress) loop
 *   firsttuple  -- wall time to first tuple of this cycle (seconds)
 *   startup     -- total startup time across all loops (seconds)
 *   total       -- total elapsed time across all loops (seconds)
 */
message MetricInstrumentation {
    uint64  ntuples            = 1;
    uint64  nloops             = 2;
    uint64  tuplecount         = 3;
    double  firsttuple         = 4;
    double  startup            = 5;
    double  total              = 6;
    uint64  shared_blks_hit   = 7;
    uint64  shared_blks_read  = 8;
}

/*
 * Node-level metrics container.  Currently wraps only instrumentation; may
 * be extended with system/spill stats in future revisions.
 */
message NodeMetrics {
    MetricInstrumentation instrumentation = 1;
}

/*
 * Common query and segment identification keys reused across messages.
 */
message QueryKey {
    int32 tmid = 1;   /* gp_gettmid() transaction/time identifier */
    int32 ssid = 2;   /* gp_session_id */
    int32 ccnt = 3;   /* gp_command_count */
}

message SegmentKey {
    int32 dbid     = 1;   /* GpIdentity.dbid */
    int32 segindex = 2;   /* GpIdentity.segindex (-1 = coordinator) */
}
