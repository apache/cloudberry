// Compatibility policy: only append fields; never change field numbers or
// remove fields. Reserve retired field numbers permanently.

syntax = "proto3";

package cloudberry.datalake.v1;

option java_multiple_files = true;
option java_package = "org.apache.cloudberry.dlagent.proto";

import "google/protobuf/struct.proto";
import "common.proto";
// fragment.proto lives in contrib/datalake_fdw/src/meta. Add that directory
// as a protoc include root so both the agent and meta engine share one schema.
import "fragment.proto";

// One RPC per entry of IcebergMetaEngine (contrib/datalake_fdw/src/meta/
// iceberg_meta_engine.h); README.md maps them in both directions.
service IcebergCatalogService {
  rpc CreateTable    (CreateTableRequest)    returns (CreateTableResponse);
  rpc LoadTable      (LoadTableRequest)      returns (LoadTableResponse);
  rpc TableExists    (TableExistsRequest)    returns (TableExistsResponse);
  rpc DropTable      (DropTableRequest)      returns (DropTableResponse);
  rpc GetStatistics  (GetStatisticsRequest)  returns (GetStatisticsResponse);

  rpc Append         (AppendRequest)         returns (AppendResponse);
  rpc Update         (UpdateRequest)         returns (UpdateResponse);
  rpc CommitAppend   (CommitAppendRequest)   returns (CommitAppendResponse);
  rpc CommitUpdate   (CommitUpdateRequest)   returns (CommitUpdateResponse);

  rpc GetFragment      (GetFragmentRequest)      returns (stream FragmentBatch);
  rpc PlanFileGroups   (PlanFileGroupsRequest)   returns (stream FileGroup);
  rpc CommitFileGroups (stream CommitFileGroupsRequest) returns (stream FileGroupCommitResult);
}

enum CommitOutcome {
  COMMIT_OUTCOME_UNSPECIFIED = 0;
  APPLIED = 1;
  REJECTED_CONFLICT = 2;
  UNKNOWN = 3;
}

message FileGroup {
  string group_id = 1;
  repeated FileMeta data_files = 2;
  repeated string delete_files = 3;
  google.protobuf.Struct attributes = 4;
  ResponseHeader response_header = 5;
}

message FileGroupCommitResult {
  string group_id = 1;
  // A boolean "committed" was here.  outcome replaces it: a commit whose
  // answer was lost is neither committed nor not, and a client that read a
  // false here would retry one that may have landed.
  reserved 2;
  ErrorDetail error = 3;   // present when outcome is not APPLIED
  google.protobuf.Struct table_metadata = 4;
  ResponseHeader response_header = 5;
  CommitOutcome outcome = 6;
  string committed_metadata_location = 7;
  string operation_id = 8;
  int64 snapshot_id = 9;       // the snapshot this group's commit produced; 0 if it did not commit
  int64 sequence_number = 10;  // that snapshot's sequence number; 0 if it did not commit
}

message CreateTableRequest {
  repeated Header headers = 1;
  TableIdentifier table = 2;
  Schema schema = 3;
  PartitionSpec partition_spec = 4;
  SortOrder sort_order = 5;
  map<string, string> table_properties = 6;
  StorageConfig storage = 7;
  string operation_id = 8;
  AuditContext audit_context = 9;  // v1.1: audit identity for snapshots created by this operation
}
message CreateTableResponse {
  TableIdentifier table = 1;
  int64 snapshot_id = 2;
  Schema schema = 3;
  google.protobuf.Struct table_metadata = 4;
  string table_uuid = 5;
  ResponseHeader response_header = 6;
  string metadata_location = 7;  // the new table's first version, as LoadTableResponse gives it
}

message LoadTableRequest {
  repeated Header headers = 1;
  TableIdentifier table = 2;
}
message LoadTableResponse {
  TableIdentifier table = 1;
  google.protobuf.Struct table_metadata = 2;
  ResponseHeader response_header = 3;
  int64 snapshot_id = 4;       // v1.2: exact current snapshot ID; 0 means no snapshot
  int64 sequence_number = 5;   // v1.2: exact current sequence number; 0 means no snapshot
  // The version of the table this answer describes, which GetFragment then
  // plans against, so a commit in between cannot change what is scanned.
  string metadata_location = 6;
  // The table's identity, which DropTableRequest.expected_table_uuid checks:
  // a table dropped and recreated under the same name has a different one.
  string table_uuid = 7;
}

message TableExistsRequest {
  repeated Header headers = 1;
  TableIdentifier table = 2;
}
message TableExistsResponse {
  bool exists = 1;
  ResponseHeader response_header = 2;
}

message DropTableRequest {
  repeated Header headers = 1;
  TableIdentifier table = 2;
  bool purge = 3;
  // Required: the UUID LoadTable returned.  Refused when empty or when it is
  // not the table's, so a table dropped and recreated under the same name is
  // never the one purged.
  string expected_table_uuid = 4;
}
message DropTableResponse {
  bool dropped = 1;
  ResponseHeader response_header = 2;
}

message GetStatisticsRequest {
  repeated Header headers = 1;
  TableIdentifier table = 2;
  int64 snapshot_id = 3;          // 0 means current
}
message GetStatisticsResponse {
  google.protobuf.Struct statistics = 1;
  ResponseHeader response_header = 2;
  int64 snapshot_id = 3;       // v1.2: exact selected snapshot ID; 0 means no snapshot
  int64 sequence_number = 4;   // v1.2: exact selected sequence number; 0 means no snapshot
}

message AppendRequest {
  repeated Header headers = 1;
  TableIdentifier table = 2;
  google.protobuf.Struct write_options = 3;
  repeated FileMeta data_files = 4;
  string operation_id = 5;
  int64 starting_snapshot_id = 6;  // v1.1: exact baseline snapshot; 0 means current
  AuditContext audit_context = 7;  // v1.1: copied to the produced snapshot summary
  // Required: the UUID LoadTable returned.  Refused when empty or when it is
  // not the table's, so files written for a table that has since been dropped
  // and recreated are never committed to its replacement.
  string expected_table_uuid = 8;
}
message AppendResponse {
  string staging_id = 1;
  google.protobuf.Struct table_metadata = 2;
  ResponseHeader response_header = 3;
  CommitOutcome outcome = 4;
  string committed_metadata_location = 5;
  string operation_id = 6;
}

message UpdateRequest {
  repeated Header headers = 1;
  TableIdentifier table = 2;
  google.protobuf.Struct write_options = 3;
  repeated FileMeta data_files = 4;
  string operation_id = 5;
  // Required and non-zero: the snapshot the statement was planned against.
  // Resolving "current" at commit time would start conflict detection after
  // whatever another writer committed in between.  A table with no snapshot
  // has no rows for an UPDATE or DELETE to touch.
  int64 starting_snapshot_id = 6;
  AuditContext audit_context = 7;  // v1.1: copied to the produced snapshot summary
  // Required: the UUID LoadTable returned.  Refused when empty or when it is
  // not the table's, so files written for a table that has since been dropped
  // and recreated are never committed to its replacement.
  string expected_table_uuid = 8;
}
message UpdateResponse {
  string staging_id = 1;
  google.protobuf.Struct table_metadata = 2;
  ResponseHeader response_header = 3;
  CommitOutcome outcome = 4;
  string committed_metadata_location = 5;
  string operation_id = 6;
}

message CommitAppendRequest {
  repeated Header headers = 1;
  TableIdentifier table = 2;
  string staging_id = 3;
  repeated FileMeta data_files = 4;
  google.protobuf.Struct commit_properties = 5;
  string operation_id = 6;
  int64 starting_snapshot_id = 7;  // v1.1: exact baseline snapshot; 0 means current
  AuditContext audit_context = 8;  // v1.1: copied to the produced snapshot summary
  // Required: the UUID LoadTable returned.  Refused when empty or when it is
  // not the table's, so files written for a table that has since been dropped
  // and recreated are never committed to its replacement.
  string expected_table_uuid = 9;
}
message CommitAppendResponse {
  int64 snapshot_id = 1;
  int64 sequence_number = 2;
  google.protobuf.Struct table_metadata = 3;
  ResponseHeader response_header = 4;
  CommitOutcome outcome = 5;
  string committed_metadata_location = 6;
  string operation_id = 7;
}

message CommitUpdateRequest {
  repeated Header headers = 1;
  TableIdentifier table = 2;
  string staging_id = 3;
  repeated FileMeta data_files = 4;
  repeated string delete_files = 5;
  google.protobuf.Struct commit_properties = 6;
  string operation_id = 7;
  // Required and non-zero: the snapshot the statement was planned against.
  // Resolving "current" at commit time would start conflict detection after
  // whatever another writer committed in between.  A table with no snapshot
  // has no rows for an UPDATE or DELETE to touch.
  int64 starting_snapshot_id = 8;
  AuditContext audit_context = 9;  // v1.1: copied to the produced snapshot summary
  // Required: the UUID LoadTable returned.  Refused when empty or when it is
  // not the table's, so files written for a table that has since been dropped
  // and recreated are never committed to its replacement.
  string expected_table_uuid = 10;
}
message CommitUpdateResponse {
  int64 snapshot_id = 1;
  int64 sequence_number = 2;
  google.protobuf.Struct table_metadata = 3;
  ResponseHeader response_header = 4;
  CommitOutcome outcome = 5;
  string committed_metadata_location = 6;
  string operation_id = 7;
}

message GetFragmentRequest {
  repeated Header headers = 1;
  TableIdentifier table = 2;
  google.protobuf.Struct scan_options = 3;
  uint32 batch_size_hint = 4;
  FilterExpr filter = 5;  // v1.1: typed predicate; omitted means no server-side filtering
  // Required: the exact table version to plan, as LoadTable returned it.
  // Planning against whatever is current would scan a snapshot, and perhaps a
  // schema, other than the one the statement was planned for.
  string metadata_location = 6;
}

message PlanFileGroupsRequest {
  repeated Header headers = 1;
  TableIdentifier table = 2;
  google.protobuf.Struct plan_options = 3;
  uint32 batch_size_hint = 4;
  int64 starting_snapshot_id = 5;  // v1.1: exact rewrite-planning baseline; 0 means current
}

// A rewrite commits one file group at a time, so its request is a stream: one
// CommitFileGroupsStart first, then one FileGroup per message.  The server
// answers each group with its FileGroupCommitResult as it commits it, and the
// client half-closes when it has sent the last.  However many groups a rewrite
// has, no single message has to hold them all.
message CommitFileGroupsRequest {
  oneof part {
    CommitFileGroupsStart start = 1;   // the first message, and only the first
    FileGroup file_group = 2;          // every message after it
  }
}

message CommitFileGroupsStart {
  repeated Header headers = 1;
  TableIdentifier table = 2;
  google.protobuf.Struct commit_properties = 3;
  string operation_id = 4;
  int64 starting_snapshot_id = 5;  // required and non-zero: the snapshot the groups were planned against
  AuditContext audit_context = 6;  // copied to each produced snapshot summary
  string expected_table_uuid = 7;  // required, as on the other commit requests
}
