// Compatibility policy: only append fields; never change field numbers or
// remove fields. Reserve retired field numbers permanently.

syntax = "proto3";

package cloudberry.datalake.v1;

option java_multiple_files = true;
option java_package = "org.apache.cloudberry.dlagent.proto";

import "common.proto";

service CatalogManagementService {
  rpc CreateCatalog   (CreateCatalogRequest)   returns (CreateCatalogResponse);
  rpc ListCatalogs    (ListCatalogsRequest)    returns (ListCatalogsResponse);
  rpc CreateNamespace (CreateNamespaceRequest) returns (CreateNamespaceResponse);
  rpc ListNamespaces  (ListNamespacesRequest)  returns (ListNamespacesResponse);
}

message CatalogInfo {
  string name = 1;
  string type = 2;
  map<string, string> properties = 3;
  StorageConfig storage = 4;
}

message NamespaceInfo {
  repeated string namespace = 1;     // v1 requires exactly one segment
  string catalog_name = 2;
  map<string, string> properties = 3;
}

message CreateCatalogRequest {
  repeated Header headers = 1;
  string prefix = 2;
  CatalogInfo catalog = 3;
  repeated string default_namespace = 4;  // v1 accepts at most one segment
}
message CreateCatalogResponse {
  CatalogInfo catalog = 1;
  ResponseHeader response_header = 2;
}

message ListCatalogsRequest {
  repeated Header headers = 1;
  string prefix = 2;
}
message ListCatalogsResponse {
  repeated CatalogInfo catalogs = 1;
  ResponseHeader response_header = 2;
}

message CreateNamespaceRequest {
  repeated Header headers = 1;
  string prefix = 2;
  NamespaceInfo namespace = 3;
}
message CreateNamespaceResponse {
  NamespaceInfo namespace = 1;
  ResponseHeader response_header = 2;
}

message ListNamespacesRequest {
  repeated Header headers = 1;
  string prefix = 2;
  string catalog_name = 3;
  repeated string parent_namespace = 4;   // empty for top-level; v1 rejects multiple segments
}
message ListNamespacesResponse {
  repeated NamespaceInfo namespaces = 1;
  ResponseHeader response_header = 2;
}
