// Compatibility policy: only append fields; never change field numbers or
// remove fields. Reserve retired field numbers permanently.

syntax = "proto3";

package cloudberry.datalake.v1;

option java_multiple_files = true;
option java_package = "org.apache.cloudberry.dlagent.proto";

import "common.proto";

// The types both sides of the metadata engine read and write directly, rather
// than only pass through: the fragments a scan is planned into, the files a
// write produces, and the predicates a scan pushes down.  Nothing here is
// specific to the agent; an in-process engine would use the same messages.

// A delete file that applies to some of a batch's fragments.
message DeleteFileRef {
  string path = 1;
  int32  content = 2;                    // Iceberg's content value: 1 = position, 2 = equality
  int64  record_count = 3;
  repeated string eq_column_names = 4;   // equality key columns, by name: what the reader matches on today
  repeated int32  equality_ids = 5;      // the same columns by field id, which survives a rename
  int64  data_sequence_number = 6;       // whether a delete applies is decided by data sequence number
  string file_format = 7;
}

// One unit of a scan: a data file, or a split of one.
message Fragment {
  string data_file_path = 1;
  string file_format = 2;
  int64  file_size = 3;
  int64  record_count = 4;
  string partition_json = 5;
  reserved 6;                            // deletes inline; delete_indexes replaced them
  int64  data_sequence_number = 7;
  // The server applies the requested filter on a best-effort basis and
  // returns what it did not consume here.  Absent means fully consumed; a
  // client rechecks every residual it is given.
  FilterExpr residual = 8;
  int32  assigned_segment = 9;           // filled in by every planning; a cached plan keeps the list before assignment
  int32  spec_id = 10;                   // the data file's own partition spec: a table written elsewhere may be partitioned
  int64  file_sequence_number = 11;
  int64  split_start = 12;
  int64  split_length = 13;
  // Indexes into FragmentBatch.delete_pool.  One out of range, or repeated,
  // is an error at the receiving end.
  repeated int32 delete_indexes = 14;
}

message FragmentBatch {
  repeated Fragment fragments = 1;
  uint32 contract_version = 2;
  repeated DeleteFileRef delete_pool = 3;  // each delete file once, however many fragments it applies to
  ResponseHeader response_header = 4;      // on every batch, as on every other response message
}

// A file one segment wrote, reported up to the dispatcher that commits it.
message FileMeta {
  string path = 1;
  string file_format = 2;
  int64  file_size = 3;
  int64  record_count = 4;
  int32  content = 5;                    // 0 = data, 1 = position delete
  string partition_json = 6;             // empty while writes are to unpartitioned tables only
  reserved 7, 8, 9;                      // per-file audit fields; FileMetaBatch carries them once
}

// What one segment sends up for one statement against one table.  The
// dispatcher keys what it receives on (operation_id, segindex, attempt, path):
// a duplicate is an error, a batch from an attempt that did not succeed is
// dropped, and a relid it is not writing is an error.
message FileMetaBatch {
  uint32 contract_version = 1;
  uint64 relid = 2;
  // Generated by the dispatcher once per statement execution.  A PostgreSQL
  // query id is a hash of the normalised statement, the same on every run,
  // so it cannot tell two executions apart.
  string operation_id = 3;
  int32  segindex = 4;
  int32  attempt = 5;
  repeated FileMeta files = 6;
}

// A predicate pushed down to planning.
message FilterExpr {
  enum Op {
    OP_UNSPECIFIED = 0;                  // the default is deliberately not an operator
    AND = 1; OR = 2; NOT = 3;
    EQ = 4; NEQ = 5; GT = 6; GTE = 7; LT = 8; LTE = 9;
    IS_NULL = 10; NOT_NULL = 11; IN = 12; NOT_IN = 13;
  }
  Op op = 1;
  int32 field_id = 2;                    // required on a leaf, ignored on AND, OR and NOT
  // Exactly one for EQ through LTE, at least one for IN and NOT_IN.  An empty
  // list means the sender did not push the predicate down.  TypedValue has no
  // NULL, so an IN or NOT_IN whose set holds one is never pushed down; the
  // executor evaluates it.
  repeated TypedValue literals = 3;
  repeated FilterExpr children = 4;      // at least two for AND and OR, exactly one for NOT
}

// The three temporal kinds count from the Unix epoch, 1970-01-01, as Iceberg's
// do.  PostgreSQL counts from 2000-01-01: a value taken from a DateADT or a
// Timestamp has 10957 days, or 946684800000000 microseconds, added before it
// is sent.  A literal off by that much prunes the wrong files, and a residual
// recheck cannot bring back a file that was never scanned.
message TypedValue {
  oneof v {
    bool b = 1;
    int64 i64 = 2;
    double f64 = 3;
    sint32 date_days = 4;                // days since 1970-01-01
    int64 ts_micros = 5;                 // microseconds since 1970-01-01 00:00:00, no time zone
    int64 tstz_micros = 6;               // microseconds since 1970-01-01 00:00:00 UTC
    string s = 7;
    bytes uuid16 = 8;
    bytes binary = 9;
    Decimal dec = 10;
  }
}

// Two's complement, big-endian, as Iceberg stores a decimal.
message Decimal {
  bytes unscaled_be = 1;
  int32 scale = 2;
}
