 <text x="440" y="48" fill="#5b5b70" font-size="11">Upstream PostgreSQL would install the real method</text>
 <text x="440" y="64" fill="#5b5b70" font-size="11">here, or ExecProcNodeInstr when instrumenting —</text>
 <text x="440" y="80" fill="#5b5b70" font-size="11">in Cloudberry that branch sits inside #if 0 at</text>
 <text x="440" y="96" fill="#5b5b70" font-size="11">execProcnode.c:627, so the wrapper always stays.</text>

