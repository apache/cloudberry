<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="100%" style="height:auto;display:block;min-width:600px" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11"><defs><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a7aa8"/></marker><marker id="gx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b8a76"/></marker></defs><text x="20" y="20" fill="#6b5b95">waits-for graph (hard cycle) on the coordinator</text><rect x="70" y="55" width="200" height="66" rx="6" fill="#fff4d6" stroke="#e0b365" stroke-width="1.5"/><text x="170" y="82" text-anchor="middle" fill="#8a6d1a">Process 29832 (A)</text><text x="170" y="100" text-anchor="middle" fill="#8a6d1a">holds t1, wants t2</text><rect x="450" y="55" width="200" height="66" rx="6" fill="#f5edff" stroke="#b79ad6" stroke-width="1.5"/><text x="550" y="82" text-anchor="middle" fill="#6b5b95">Process 29882 (B)</text><text x="550" y="100" text-anchor="middle" fill="#6b5b95">holds t2, wants t1</text><path d="M270 78 L448 78" stroke="#8a7aa8" stroke-width="1.5" fill="none" marker-end="url(#ax)"/><text x="360" y="70" text-anchor="middle" fill="#8a7aa8">waits for ExclusiveLock on t2</text><path d="M448 100 L272 100" stroke="#8a7aa8" stroke-width="1.5" fill="none" marker-end="url(#ax)"/><text x="360" y="118" text-anchor="middle" fill="#8a7aa8">waits for ExclusiveLock on t1</text><text x="20" y="160" fill="#6b8a76">DS_HARD_DEADLOCK &#8594; abort victim A (40P01) &#8594; A releases t1</text><path d="M170 168 L170 190 L550 190 L550 128" stroke="#6b8a76" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#gx)"/><text x="360" y="205" text-anchor="middle" fill="#6b8a76">edge removed &#8594; B acquires t1 and commits</text></svg>