<svg viewBox="0 0 760 400" style="max-width:100%;font-family:ui-monospace,monospace" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="24" font-size="13" font-weight="bold" fill="#5b4a7a">CdbLocusType</text>
  <text x="484" y="38" font-size="11" fill="#888">seg0</text><text x="578" y="38" font-size="11" fill="#888">seg1</text><text x="672" y="38" font-size="11" fill="#888">seg2</text>
  <!-- rows -->
  <!-- Entry -->
  <rect x="10" y="44" width="150" height="38" rx="6" fill="#f5edff" stroke="#cdb4db"/><text x="85" y="68" font-size="13" text-anchor="middle" fill="#5b4a7a">Entry</text>
  <text x="172" y="68" font-size="12" fill="#555">only the coordinator (QD)</text>
  <rect x="470" y="52" width="88" height="24" rx="3" fill="#fff" stroke="#ddd" stroke-dasharray="3 3"/><rect x="564" y="52" width="88" height="24" rx="3" fill="#fff" stroke="#ddd" stroke-dasharray="3 3"/><rect x="658" y="52" width="88" height="24" rx="3" fill="#fff" stroke="#ddd" stroke-dasharray="3 3"/>
  <text x="514" y="68" font-size="11" text-anchor="middle" fill="#bbb">-</text><text x="608" y="68" font-size="11" text-anchor="middle" fill="#bbb">-</text><text x="702" y="68" font-size="11" text-anchor="middle" fill="#bbb">-</text>
  <!-- SingleQE -->
  <rect x="10" y="94" width="150" height="38" rx="6" fill="#f5edff" stroke="#cdb4db"/><text x="85" y="118" font-size="13" text-anchor="middle" fill="#5b4a7a">SingleQE</text>
  <text x="172" y="118" font-size="12" fill="#555">one QE on a single segment</text>
  <rect x="470" y="102" width="88" height="24" rx="3" fill="#e3d4f5" stroke="#cdb4db"/><rect x="564" y="102" width="88" height="24" rx="3" fill="#fff" stroke="#ddd" stroke-dasharray="3 3"/><rect x="658" y="102" width="88" height="24" rx="3" fill="#fff" stroke="#ddd" stroke-dasharray="3 3"/>
  <text x="514" y="118" font-size="11" text-anchor="middle" fill="#5b4a7a">rows</text>
  <!-- General -->
  <rect x="10" y="144" width="150" height="38" rx="6" fill="#eafaf0" stroke="#cfead9"/><text x="85" y="168" font-size="13" text-anchor="middle" fill="#2f6b46">General</text>
  <text x="172" y="168" font-size="12" fill="#555">a constant — valid on any process</text>
  <rect x="470" y="152" width="88" height="24" rx="3" fill="#eafaf0" stroke="#cfead9"/><rect x="564" y="152" width="88" height="24" rx="3" fill="#eafaf0" stroke="#cfead9"/><rect x="658" y="152" width="88" height="24" rx="3" fill="#eafaf0" stroke="#cfead9"/>
  <text x="514" y="168" font-size="11" text-anchor="middle" fill="#2f6b46">c</text><text x="608" y="168" font-size="11" text-anchor="middle" fill="#2f6b46">c</text><text x="702" y="168" font-size="11" text-anchor="middle" fill="#2f6b46">c</text>
  <!-- SegmentGeneral -->
  <rect x="10" y="194" width="150" height="38" rx="6" fill="#eafaf0" stroke="#cfead9"/><text x="85" y="218" font-size="12" text-anchor="middle" fill="#2f6b46">SegmentGeneral</text>
  <text x="172" y="218" font-size="12" fill="#555">full copy on every segment (replicated table)</text>
  <rect x="470" y="202" width="88" height="24" rx="3" fill="#cfead9" stroke="#2f6b46"/><rect x="564" y="202" width="88" height="24" rx="3" fill="#cfead9" stroke="#2f6b46"/><rect x="658" y="202" width="88" height="24" rx="3" fill="#cfead9" stroke="#2f6b46"/>
  <text x="514" y="218" font-size="11" text-anchor="middle" fill="#2f6b46">copy</text><text x="608" y="218" font-size="11" text-anchor="middle" fill="#2f6b46">copy</text><text x="702" y="218" font-size="11" text-anchor="middle" fill="#2f6b46">copy</text>
  <!-- Replicated -->
  <rect x="10" y="244" width="150" height="38" rx="6" fill="#fff4d6" stroke="#8a6d1a"/><text x="85" y="268" font-size="13" text-anchor="middle" fill="#8a6d1a">Replicated</text>
  <text x="172" y="268" font-size="12" fill="#555">broadcast copy on every QE of a gang</text>
  <rect x="470" y="252" width="88" height="24" rx="3" fill="#ffe9ad" stroke="#8a6d1a"/><rect x="564" y="252" width="88" height="24" rx="3" fill="#ffe9ad" stroke="#8a6d1a"/><rect x="658" y="252" width="88" height="24" rx="3" fill="#ffe9ad" stroke="#8a6d1a"/>
  <text x="514" y="268" font-size="11" text-anchor="middle" fill="#8a6d1a">copy</text><text x="608" y="268" font-size="11" text-anchor="middle" fill="#8a6d1a">copy</text><text x="702" y="268" font-size="11" text-anchor="middle" fill="#8a6d1a">copy</text>
  <!-- Hashed -->
  <rect x="10" y="294" width="150" height="38" rx="6" fill="#fff4d6" stroke="#8a6d1a"/><text x="85" y="318" font-size="13" text-anchor="middle" fill="#8a6d1a">Hashed</text>
  <text x="172" y="318" font-size="12" fill="#555">disjoint slices by hash of key columns</text>
  <rect x="470" y="302" width="88" height="24" rx="3" fill="#ffe9ad" stroke="#8a6d1a"/><rect x="564" y="302" width="88" height="24" rx="3" fill="#ffe9ad" stroke="#8a6d1a"/><rect x="658" y="302" width="88" height="24" rx="3" fill="#ffe9ad" stroke="#8a6d1a"/>
  <text x="514" y="318" font-size="11" text-anchor="middle" fill="#8a6d1a">h(k)=0</text><text x="608" y="318" font-size="11" text-anchor="middle" fill="#8a6d1a">h(k)=1</text><text x="702" y="318" font-size="11" text-anchor="middle" fill="#8a6d1a">h(k)=2</text>
  <!-- Strewn -->
  <rect x="10" y="344" width="150" height="38" rx="6" fill="#fff4d6" stroke="#8a6d1a"/><text x="85" y="368" font-size="13" text-anchor="middle" fill="#8a6d1a">Strewn</text>
  <text x="172" y="368" font-size="12" fill="#555">random / round-robin — no known function</text>
  <rect x="470" y="352" width="88" height="24" rx="3" fill="#ffe9ad" stroke="#8a6d1a"/><rect x="564" y="352" width="88" height="24" rx="3" fill="#ffe9ad" stroke="#8a6d1a"/><rect x="658" y="352" width="88" height="24" rx="3" fill="#ffe9ad" stroke="#8a6d1a"/>
  <text x="514" y="368" font-size="11" text-anchor="middle" fill="#8a6d1a">?</text><text x="608" y="368" font-size="11" text-anchor="middle" fill="#8a6d1a">?</text><text x="702" y="368" font-size="11" text-anchor="middle" fill="#8a6d1a">?</text>
</svg>