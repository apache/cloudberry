  <text x="30" y="40" font-weight="700" fill="#4b3a6b">Query   ⟦parsenodes.h:153⟧</text>
  <!-- rtable -->
  <text x="30" y="70" fill="#4b3a6b">rtable  (List of RangeTblEntry)</text>
  <rect x="34" y="80" width="322" height="46" rx="6" fill="#eafaf0" stroke="#cfead9" stroke-width="1.5"/>
  <text x="46" y="100" fill="#2f6b47">[0] RTE  p151_t   rtekind=RELATION</text>
  <text x="46" y="118" fill="#7a8c82">relid=18060  rt_index 1</text>
