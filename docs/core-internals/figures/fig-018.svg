<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" style="height:auto;display:block;min-width:600px" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11"><defs><marker id="ax2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a7aa8"/></marker></defs><text x="10" y="20" fill="#6b5b95">case 1 — single locker (HEAP_XMAX_IS_MULTI = 0):</text><rect x="10" y="30" width="150" height="34" rx="6" fill="#f5edff" stroke="#b79ad6" stroke-width="1.5"/><text x="85" y="51" text-anchor="middle">t_infomask</text><rect x="170" y="30" width="150" height="34" rx="6" fill="#fff4d6" stroke="#e0b365"/><text x="245" y="47" text-anchor="middle" fill="#8a6d1a">t_xmax =</text><text x="245" y="60" text-anchor="middle" fill="#8a6d1a">xid 1146</text><text x="330" y="52" fill="#8a7aa8">→ one transaction; look it up in CLOG (§9)</text><text x="10" y="112" fill="#6b5b95">case 2 — several shared lockers (HEAP_XMAX_IS_MULTI = 1):</text><rect x="10" y="122" width="150" height="34" rx="6" fill="#eafaf0" stroke="#cfead9"/><text x="85" y="139" text-anchor="middle" fill="#3b6b4d">…| IS_MULTI</text><text x="85" y="152" text-anchor="middle" fill="#3b6b4d">| LOCK_ONLY</text><rect x="170" y="122" width="150" height="34" rx="6" fill="#fff4d6" stroke="#e0b365"/><text x="245" y="139" text-anchor="middle" fill="#8a6d1a">t_xmax =</text><text x="245" y="152" text-anchor="middle" fill="#8a6d1a">MultiXactId 42</text><line x1="320" y1="139" x2="400" y2="139" stroke="#8a7aa8" stroke-width="1.5" marker-end="url(#ax2)"/><rect x="405" y="110" width="300" height="60" rx="6" fill="#f5edff" stroke="#b79ad6" stroke-width="1.5"/><text x="555" y="127" text-anchor="middle" fill="#6b5b95">pg_multixact members(42):</text><text x="555" y="145" text-anchor="middle">(xid 1147, ForShare)</text><text x="555" y="161" text-anchor="middle">(xid 1149, ForShare)</text><text x="10" y="205" fill="#8a7aa8">Both cases also set HEAP_XMAX_LOCK_ONLY when no updater is present, so visibility (§10) still treats the row as live.</text></svg>