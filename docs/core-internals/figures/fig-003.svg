<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 314" width="100%" style="height:auto;display:block;min-width:600px" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
        <defs>
          <marker id="aop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a7aa8"/></marker>
          <marker id="aog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b8a76"/></marker>
        </defs>
        <text x="14" y="13" font-weight="700" fill="#6b5b95">&#9312; the index entry carries a fake heap TID</text>
        <rect x="14" y="20" width="206" height="50" rx="6" fill="#f5edff" stroke="#b79ad6" stroke-width="1.5"/>
        <text x="117" y="41" text-anchor="middle" font-weight="700">btree index entry</text>
        <text x="117" y="58" text-anchor="middle" font-size="10" fill="#444">ctid (33554432, 339)</text>
        <path d="M220 45 H306" fill="none" stroke="#8a7aa8" stroke-width="1.6" marker-end="url(#aop)"/>
        <text x="263" y="39" text-anchor="middle" font-size="9" fill="#8a7aa8">treated as HEAPTID</text>
        <rect x="306" y="20" width="240" height="50" rx="6" fill="#fff4d6" stroke="#e0b365" stroke-width="1.5"/>
        <text x="426" y="41" text-anchor="middle" font-weight="700" fill="#8a6d1a">AOTupleId (decoded)</text>
        <text x="426" y="58" text-anchor="middle" font-size="10" fill="#8a6d1a">segno 1 &#183; rowNum 338</text>
        <path d="M426 70 V108" fill="none" stroke="#8a7aa8" stroke-width="1.6" marker-end="url(#aop)"/>
        <text x="436" y="91" font-size="9" fill="#8a7aa8">lookup(segno 1, rowNum 338)</text>
        <text x="14" y="103" font-weight="700" fill="#6b5b95">&#9313; block directory: minipage entry whose range covers rowNum 338</text>
        <rect x="150" y="110" width="420" height="54" rx="6" fill="#f5edff" stroke="#b79ad6" stroke-width="1.5"/>
        <text x="360" y="127" text-anchor="middle" font-size="10" fill="#5e4b86" font-weight="700">pg_aoblkdir minipage</text>
        <text x="360" y="143" text-anchor="middle">{ firstRowNum 1 &#183; fileOffset 0 &#183; rowCount 338 }</text>
        <text x="360" y="157" text-anchor="middle" font-size="10" fill="#6b8a76" font-weight="600">338 &#8712; [1, 338] &#10003;</text>
        <path d="M360 164 V200" fill="none" stroke="#8a7aa8" stroke-width="1.6" marker-end="url(#aop)"/>
        <text x="370" y="185" font-size="9" fill="#8a7aa8">seek fileOffset 0</text>
        <text x="14" y="195" font-weight="700" fill="#6b5b95">&#9314; read that one varblock, then walk forward to the row</text>
        <rect x="60" y="202" width="600" height="72" rx="6" fill="none" stroke="#b79ad6" stroke-width="2"/>
        <rect x="60" y="202" width="600" height="16" fill="#efe3fb"/>
        <text x="360" y="214" text-anchor="middle" font-size="10" fill="#5e4b86" font-weight="700">segfile relfilenode.1 &#8212; read front-to-back</text>
        <rect x="78" y="226" width="300" height="40" fill="#eafaf0" stroke="#cfead9"/>
        <text x="228" y="242" text-anchor="middle" font-weight="700">varblock @ offset 0</text>
        <text x="228" y="257" text-anchor="middle" font-size="9" fill="#444">338 MemTuples, decompressed</text>
        <rect x="410" y="226" width="150" height="40" fill="#fff4d6" stroke="#e0b365"/>
        <text x="485" y="242" text-anchor="middle" font-weight="700" fill="#8a6d1a">MemTuple #338</text>
        <text x="485" y="257" text-anchor="middle" font-size="9" fill="#8a6d1a">the target row</text>
        <path d="M378 246 H408" fill="none" stroke="#6b8a76" stroke-width="2" marker-end="url(#aog)"/>
        <text x="393" y="239" text-anchor="middle" font-size="9" fill="#6b8a76">walk 337</text>
        <text x="360" y="294" text-anchor="middle" font-size="10" fill="#8a7aa8">one extra level of indirection vs a heap read (README.md:128&#8211;130)</text>
      </svg>