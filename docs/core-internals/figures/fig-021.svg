<text class="dsp" x="470" y="196" font-size="10">⟶ dispatch COMMIT_ONEPHASE</text>
<!-- abort branch -->
<rect class="b" x="470" y="280" width="270" height="70" rx="5" fill="#ffe9ec" stroke="#b3455a"/>
<text x="605" y="300" text-anchor="middle" fill="#7a2233">NOTIFYING_ABORT_NO_PREPARED</text>
<text x="605" y="317" text-anchor="middle" fill="#7a2233">NOTIFYING_ABORT_SOME_PREPARED</text>
<text x="605" y="334" text-anchor="middle" fill="#7a2233">NOTIFYING_ABORT_PREPARED</text>
<path d="M250,161 C360,161 440,240 469,282" stroke="#b3455a" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#ah122r)"/>
<text x="360" y="205" fill="#b3455a" font-style="italic" font-size="10">on error before commit point</text>
</svg>