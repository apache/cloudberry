<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 560" font-family="ui-monospace,monospace" font-size="11" width="100%">
<defs>
<marker id="ah122" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b4b8a"/></marker>
<marker id="ah122r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b3455a"/></marker>
</defs>
<style>.b{stroke-width:1.4}.t{fill:#2a2340}.arr{stroke:#5b4b8a;stroke-width:1.5;fill:none;marker-end:url(#ah122)}.dsp{fill:#8a6d1a;font-style:italic}</style>
<!-- spine boxes -->
<g>
<rect class="b" x="40" y="14" width="210" height="30" rx="5" fill="#f5edff" stroke="#cdb4db"/><text class="t" x="145" y="33" text-anchor="middle">ACTIVE_DISTRIBUTED</text>
<rect class="b" x="40" y="80" width="210" height="30" rx="5" fill="#f5edff" stroke="#cdb4db"/><text class="t" x="145" y="99" text-anchor="middle">PREPARING</text>
<rect class="b" x="40" y="146" width="210" height="30" rx="5" fill="#f5edff" stroke="#cdb4db"/><text class="t" x="145" y="165" text-anchor="middle">PREPARED</text>
<rect class="b" x="40" y="212" width="210" height="30" rx="5" fill="#fff4d6" stroke="#8a6d1a"/><text class="t" x="145" y="231" text-anchor="middle">INSERTING_COMMITTED</text>
<rect class="b" x="40" y="278" width="210" height="30" rx="5" fill="#fff4d6" stroke="#8a6d1a"/><text class="t" x="145" y="297" text-anchor="middle">INSERTED_COMMITTED</text>
<rect class="b" x="40" y="344" width="210" height="30" rx="5" fill="#f5edff" stroke="#cdb4db"/><text class="t" x="145" y="363" text-anchor="middle">NOTIFYING_COMMIT_PREPARED</text>
<rect class="b" x="40" y="410" width="210" height="30" rx="5" fill="#f5edff" stroke="#cdb4db"/><text class="t" x="145" y="429" text-anchor="middle">INSERTING_FORGET_COMMITTED</text>
<rect class="b" x="40" y="476" width="210" height="30" rx="5" fill="#eafaf0" stroke="#cfead9"/><text class="t" x="145" y="495" text-anchor="middle">INSERTED_FORGET_COMMITTED</text>
</g>
<!-- spine arrows -->
<path class="arr" d="M145,44 L145,80"/>
<path class="arr" d="M145,110 L145,146"/>
<path class="arr" d="M145,176 L145,212"/>
<path class="arr" d="M145,242 L145,278"/>
<path class="arr" d="M145,308 L145,344"/>
<path class="arr" d="M145,374 L145,410"/>
<path class="arr" d="M145,440 L145,476"/>
<!-- dispatch annotations -->
<text class="dsp" x="258" y="132">⟶ dispatch PREPARE</text>
<text class="dsp" x="258" y="330">⟶ dispatch COMMIT_PREPARED</text>
<text x="258" y="228" fill="#8a6d1a">QD writes distributed-commit WAL</text>
<text x="258" y="245" fill="#8a6d1a" font-weight="bold">= the commit point (no abort past here)</text>
<text x="258" y="493" fill="#3a7d55">writes distributed FORGET record</text>
<!-- one-phase branch -->
<rect class="b" x="470" y="80" width="200" height="30" rx="5" fill="#eafaf0" stroke="#cfead9"/><text class="t" x="570" y="99" text-anchor="middle">ONE_PHASE_COMMIT</text>
<rect class="b" x="470" y="146" width="200" height="30" rx="5" fill="#eafaf0" stroke="#cfead9"/><text class="t" x="570" y="165" text-anchor="middle">NOTIFYING_ONE_PHASE_COMMIT</text>
<path class="arr" d="M250,29 C360,29 460,60 469,80"/>
<path class="arr" d="M570,110 L570,146"/>
