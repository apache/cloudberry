 <path d="M100,126 L100,48 L529,48 L529,126" fill="none" stroke="#b04a4a" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#m174inv)"/>
 <text x="315" y="40" font-size="9" fill="#b04a4a" text-anchor="middle">a catcache or relcache invalidation bumps a counter, MDCacheNeedsReset() sees it, CMDCache::Reset() throws the whole cache away</text>

 <rect x="12" y="126" width="176" height="118" rx="6" fill="#eafaf0" stroke="#cfead9" stroke-width="1.5"/>
 <text x="100" y="146" font-size="10.5" font-weight="bold" fill="#333" text-anchor="middle">PostgreSQL catalog</text>
 <text x="100" y="164" font-size="9" fill="#555" text-anchor="middle">relcache + syscache</text>
 <text x="100" y="186" font-size="9" fill="#333" text-anchor="middle">pg_class &#183; pg_attribute</text>
 <text x="100" y="202" font-size="9" fill="#333" text-anchor="middle">pg_statistic (+ _ext)</text>
 <text x="100" y="218" font-size="9" fill="#333" text-anchor="middle">gp_distribution_policy</text>
 <text x="100" y="234" font-size="9" fill="#333" text-anchor="middle">pg_type &#183; pg_operator &#8230;</text>

 <rect x="232" y="126" width="186" height="118" rx="6" fill="#fff4d6" stroke="#8a6d1a" stroke-width="1.5"/>
 <text x="325" y="146" font-size="10.5" font-weight="bold" fill="#333" text-anchor="middle">CMDProviderRelcache</text>
 <text x="325" y="164" font-size="9" fill="#555" text-anchor="middle">delegates straight to</text>
 <text x="325" y="186" font-size="9" fill="#333" text-anchor="middle">CTranslatorRelcacheToDXL</text>
 <text x="325" y="202" font-size="9" fill="#333" text-anchor="middle">::RetrieveObject(mdid)</text>
 <text x="325" y="224" font-size="9" fill="#555" text-anchor="middle">the ONLY code here that</text>
 <text x="325" y="238" font-size="9" fill="#555" text-anchor="middle">opens a Relation</text>

 <rect x="458" y="126" width="142" height="118" rx="6" fill="#f5edff" stroke="#cdb4db" stroke-width="1.5"/>
 <text x="529" y="146" font-size="10.5" font-weight="bold" fill="#333" text-anchor="middle">CMDCache</text>
 <text x="529" y="164" font-size="9" fill="#555" text-anchor="middle">one per backend</text>
 <text x="529" y="186" font-size="9" fill="#333" text-anchor="middle">survives across</text>
 <text x="529" y="202" font-size="9" fill="#333" text-anchor="middle">queries</text>
 <text x="529" y="228" font-size="9" fill="#555" text-anchor="middle">quota 16384 kB</text>

 <rect x="640" y="126" width="142" height="118" rx="6" fill="#f5edff" stroke="#cdb4db" stroke-width="1.5"/>
 <text x="711" y="146" font-size="10.5" font-weight="bold" fill="#333" text-anchor="middle">CMDAccessor</text>
 <text x="711" y="164" font-size="9" fill="#555" text-anchor="middle">local hashtable</text>
 <text x="711" y="186" font-size="9" fill="#333" text-anchor="middle">one per</text>
 <text x="711" y="202" font-size="9" fill="#333" text-anchor="middle">optimization</text>
 <text x="711" y="228" font-size="9" fill="#555" text-anchor="middle">+ deletion locks</text>

 <rect x="822" y="126" width="106" height="118" rx="6" fill="#f5edff" stroke="#cdb4db" stroke-width="1.5"/>
 <text x="875" y="146" font-size="10.5" font-weight="bold" fill="#333" text-anchor="middle">ORCA</text>
 <text x="875" y="164" font-size="9" fill="#555" text-anchor="middle">libgpopt</text>
 <text x="875" y="190" font-size="9" fill="#333" text-anchor="middle">sees only</text>
 <text x="875" y="206" font-size="9" fill="#333" text-anchor="middle">IMD*</text>
 <text x="875" y="222" font-size="9" fill="#333" text-anchor="middle">interfaces</text>

