 <line x1="232" y1="106" x2="194" y2="106" stroke="#8a6d1a" stroke-width="1.6" marker-end="url(#m174ask)"/>
 <text x="802" y="94" font-size="9" fill="#8a6d1a" text-anchor="middle">1 ask by mdid</text>
 <text x="620" y="94" font-size="9" fill="#8a6d1a" text-anchor="middle">2 miss in local HT</text>
