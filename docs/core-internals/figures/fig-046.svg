 <line x1="422" y1="266" x2="454" y2="266" stroke="#4a7c59" stroke-width="1.6" marker-end="url(#m174ans)"/>
 <line x1="604" y1="266" x2="636" y2="266" stroke="#4a7c59" stroke-width="1.6" marker-end="url(#m174ans)"/>
 <line x1="786" y1="266" x2="818" y2="266" stroke="#4a7c59" stroke-width="1.6" marker-end="url(#m174ans)"/>
 <text x="210" y="284" font-size="9" fill="#4a7c59" text-anchor="middle">5 catalog rows</text>
 <text x="438" y="284" font-size="9" fill="#4a7c59" text-anchor="middle">6 a DXL MD object</text>
 <text x="620" y="284" font-size="9" fill="#4a7c59" text-anchor="middle">7 insert + pin</text>
 <text x="802" y="284" font-size="9" fill="#4a7c59" text-anchor="middle">8 const pointer</text>

