<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" style="height:auto;display:block;min-width:600px" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
      <defs>
      <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a7aa8"/></marker>
      <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b8a76"/></marker>
      </defs>
      <circle cx="360" cy="185" r="130" fill="none" stroke="#cdb4db" stroke-width="1.5"/>
      <path d="M360 55 A130 130 0 0 0 360 315" fill="none" stroke="#6b8a76" stroke-width="9" opacity="0.55"/>
      <path d="M360 315 A130 130 0 0 0 360 55" fill="none" stroke="#e0b365" stroke-width="9" opacity="0.55"/>
