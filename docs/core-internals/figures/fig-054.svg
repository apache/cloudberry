<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="100%" style="max-width:760px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">
  <defs>
    <marker id="m184a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b4fa0"/></marker>
    <marker id="m184b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a6d1a"/></marker>
  </defs>

  <rect x="6" y="6" width="240" height="256" rx="8" fill="#f5edff" stroke="#cdb4db"/>
  <text x="20" y="28" font-size="13" font-weight="600" fill="#4a3663">Nested Loop</text>
  <text x="20" y="46" font-size="10.5" fill="#5b5b5b">holds: 1 outer tuple</text>
  <rect x="20" y="60" width="52" height="20" rx="3" fill="#fff" stroke="#8f7cb0"/><text x="30" y="74" font-size="10" fill="#333">outer</text>
  <line x1="72" y1="70" x2="118" y2="70" stroke="#6b4fa0" stroke-width="1.5" marker-end="url(#m184a)"/>
  <rect x="120" y="52" width="106" height="36" rx="4" fill="#fff4d6" stroke="#8a6d1a"/>
  <text x="130" y="66" font-size="9.5" fill="#5c4708">for each outer</text>
  <text x="130" y="80" font-size="9.5" fill="#5c4708">tuple: rescan</text>
  <rect x="60" y="120" width="146" height="52" rx="4" fill="#fff" stroke="#8f7cb0"/>
  <text x="72" y="140" font-size="10.5" fill="#333">inner subtree</text>
  <text x="72" y="156" font-size="9.5" fill="#666">re-executed N times</text>
  <path d="M226 88 C252 108 252 150 210 150" fill="none" stroke="#8a6d1a" stroke-width="1.5" marker-end="url(#m184b)"/>
  <text x="30" y="196" font-size="9.5" fill="#5c4708">ExecReScan per outer tuple</text>
  <text x="30" y="212" font-size="9.5" fill="#5c4708">loops=N on the inner node</text>
  <text x="30" y="236" font-size="9.5" fill="#666">no ordering, no memory bound;</text>
  <text x="30" y="250" font-size="9.5" fill="#666">the only shape that takes params</text>

  <rect x="260" y="6" width="240" height="256" rx="8" fill="#eafaf0" stroke="#cfead9"/>
  <text x="274" y="28" font-size="13" font-weight="600" fill="#20553a">Merge Join</text>
  <text x="274" y="46" font-size="10.5" fill="#5b5b5b">holds: 2 cursors plus 1 mark</text>
  <rect x="274" y="60" width="86" height="112" rx="4" fill="#fff" stroke="#6aa585"/>
  <text x="284" y="76" font-size="10" fill="#333">outer, sorted</text>
  <rect x="284" y="84" width="66" height="16" fill="#eafaf0" stroke="#9ccbb3"/><text x="290" y="96" font-size="9" fill="#333">key 3</text>
  <rect x="284" y="102" width="66" height="16" fill="#fff4d6" stroke="#8a6d1a"/><text x="290" y="114" font-size="9" fill="#333">key 7</text>
  <rect x="284" y="120" width="66" height="16" fill="#eafaf0" stroke="#9ccbb3"/><text x="290" y="132" font-size="9" fill="#333">key 9</text>
  <rect x="400" y="60" width="86" height="112" rx="4" fill="#fff" stroke="#6aa585"/>
  <text x="410" y="76" font-size="10" fill="#333">inner, sorted</text>
  <rect x="410" y="84" width="66" height="16" fill="#eafaf0" stroke="#9ccbb3"/><text x="416" y="96" font-size="9" fill="#333">key 5</text>
  <rect x="410" y="102" width="66" height="16" fill="#fff4d6" stroke="#8a6d1a"/><text x="416" y="114" font-size="9" fill="#333">key 7</text>
  <rect x="410" y="120" width="66" height="16" fill="#fff4d6" stroke="#8a6d1a"/><text x="416" y="132" font-size="9" fill="#333">key 7</text>
  <line x1="352" y1="110" x2="404" y2="110" stroke="#20553a" stroke-width="1.5" marker-end="url(#m184a)"/>
  <text x="360" y="104" font-size="8.5" fill="#20553a">compare</text>
  <path d="M492 110 C512 126 512 152 480 152" fill="none" stroke="#8a6d1a" stroke-width="1.5" marker-end="url(#m184b)"/>
  <text x="392" y="164" font-size="9" fill="#8a6d1a">mark</text>
  <text x="274" y="196" font-size="9.5" fill="#20553a">duplicate inner group means</text>
  <text x="274" y="212" font-size="9.5" fill="#20553a">ExecMarkPos then ExecRestrPos</text>
  <text x="274" y="236" font-size="9.5" fill="#666">needs sorted input on both sides;</text>
  <text x="274" y="250" font-size="9.5" fill="#666">may stop before either side ends</text>

  <rect x="514" y="6" width="240" height="256" rx="8" fill="#f5edff" stroke="#cdb4db"/>
  <text x="528" y="28" font-size="13" font-weight="600" fill="#4a3663">Hash Join</text>
  <text x="528" y="46" font-size="10.5" fill="#5b5b5b">holds: the entire inner side</text>
  <rect x="528" y="58" width="120" height="98" rx="4" fill="#fff4d6" stroke="#8a6d1a"/>
  <text x="538" y="74" font-size="10" fill="#5c4708">buckets</text>
  <line x1="538" y1="82" x2="638" y2="82" stroke="#d9c48a"/>
  <rect x="538" y="88" width="16" height="12" fill="#fff" stroke="#8a6d1a"/><rect x="558" y="88" width="16" height="12" fill="#fff" stroke="#8a6d1a"/><rect x="578" y="88" width="16" height="12" fill="#fff" stroke="#8a6d1a"/>
  <rect x="538" y="108" width="16" height="12" fill="#fff" stroke="#8a6d1a"/><rect x="558" y="108" width="16" height="12" fill="#fff" stroke="#8a6d1a"/>
  <rect x="538" y="128" width="16" height="12" fill="#fff" stroke="#8a6d1a"/>
  <text x="600" y="98" font-size="9" fill="#5c4708">chains</text>
  <rect x="528" y="168" width="52" height="20" rx="3" fill="#fff" stroke="#8f7cb0"/><text x="538" y="182" font-size="10" fill="#333">outer</text>
  <line x1="580" y1="178" x2="626" y2="178" stroke="#6b4fa0" stroke-width="1.5" marker-end="url(#m184a)"/>
  <text x="630" y="182" font-size="9.5" fill="#4a3663">probe</text>
  <text x="528" y="212" font-size="9.5" fill="#5c4708">phase 1 build, phase 2 probe</text>
  <text x="528" y="236" font-size="9.5" fill="#666">bounded by the memory budget:</text>
  <text x="528" y="250" font-size="9.5" fill="#666">overflow spills to batch files</text>
</svg>