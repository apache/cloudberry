<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" style="height:auto;display:block;min-width:600px" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
        <defs>
          <marker id="psn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c79a3a"/></marker>
          <marker id="psd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a7aa8"/></marker>
        </defs>
        <text x="14" y="16" font-weight="700" fill="#6b5b95">BEFORE — leaf L is full</text>
        <rect x="40" y="26" width="240" height="40" rx="5" fill="#eafaf0" stroke="#cfead9" stroke-width="1.5"/>
        <text x="160" y="43" text-anchor="middle" font-weight="700">leaf L (full)</text>
        <text x="160" y="58" text-anchor="middle" font-size="9.5" fill="#444">keys 1 … N</text>
        <path d="M280 46 H392" fill="none" stroke="#c79a3a" stroke-width="2" marker-end="url(#psn)"/>
        <text x="336" y="40" text-anchor="middle" font-size="8.5" fill="#8a6d1a">btpo_next</text>
        <rect x="394" y="26" width="150" height="40" rx="5" fill="#f5edff" stroke="#b79ad6" stroke-width="1.5"/>
        <text x="469" y="49" text-anchor="middle" font-weight="700" fill="#5e4b86">R_old (right sibling)</text>
        <text x="360" y="94" text-anchor="middle" font-size="10.5" fill="#8a7aa8">▼ _bt_split — move the upper half to a new page R, rewire right-links</text>
        <text x="14" y="122" font-weight="700" fill="#6b5b95">AFTER</text>
        <rect x="40" y="132" width="200" height="48" rx="5" fill="#eafaf0" stroke="#cfead9" stroke-width="1.5"/>
        <text x="140" y="150" text-anchor="middle" font-weight="700">L (lower half)</text>
        <text x="140" y="165" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="700">⟦BTP_INCOMPLETE_SPLIT⟧</text>
        <path d="M240 156 H300" fill="none" stroke="#c79a3a" stroke-width="2" marker-end="url(#psn)"/>
        <text x="270" y="150" text-anchor="middle" font-size="8.5" fill="#8a6d1a">btpo_next</text>
        <rect x="302" y="132" width="180" height="48" rx="5" fill="#fff4d6" stroke="#e0b365" stroke-width="1.5"/>
        <text x="392" y="150" text-anchor="middle" font-weight="700" fill="#8a6d1a">new R (upper half)</text>
        <text x="392" y="165" text-anchor="middle" font-size="9" fill="#8a6d1a">high key copied up</text>
        <path d="M482 156 H540" fill="none" stroke="#c79a3a" stroke-width="2" marker-end="url(#psn)"/>
        <rect x="542" y="132" width="150" height="48" rx="5" fill="#f5edff" stroke="#b79ad6" stroke-width="1.5"/>
        <text x="617" y="159" text-anchor="middle" font-weight="700" fill="#5e4b86">R_old</text>
        <path d="M392 132 L392 108" fill="none" stroke="#8a7aa8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#psd)"/>
        <text x="400" y="122" font-size="8.5" fill="#8a7aa8">downlink into parent (added next; on crash → _bt_finish_split)</text>
        <text x="360" y="210" text-anchor="middle" font-size="10" fill="#8a7aa8">R is reachable by the right-link the instant it exists — readers never see an inconsistent tree</text>
      </svg>